apiVersion: apps/v1
kind: Deployment
metadata:
  name: bi-back
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bi-back
  template:
    metadata:
      labels:
        app: bi-back
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: ghcr.io/gabrielwyp/sonia-bi-back:replace-with-tag
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: bi-agent-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bi-agent-openai
                  key: OPENAI_API_KEY
                  optional: true
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: dataset
              mountPath: /data/bi
              readOnly: true
            - name: temporary
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
      volumes:
        - name: dataset
          persistentVolumeClaim:
            claimName: replace-with-bi-dataset-pvc
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bi-back
spec:
  type: ClusterIP
  selector:
    app: bi-back
  ports:
    - port: 8080
      targetPort: 8080
