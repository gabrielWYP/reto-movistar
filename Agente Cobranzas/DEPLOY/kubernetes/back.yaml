apiVersion: apps/v1
kind: Deployment
metadata:
  name: collections-back
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collections-back
  template:
    metadata:
      labels:
        app: collections-back
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: ghcr.io/gabrielwyp/sonia-collections-back:replace-with-tag
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: collections-agent-config
          env:
            - name: OPENCODE_KEY
              valueFrom:
                secretKeyRef:
                  name: collections-agent-opencode
                  key: OPENCODE_KEY
                  optional: true
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: temporary
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
      volumes:
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: collections-back
spec:
  type: ClusterIP
  selector:
    app: collections-back
  ports:
    - port: 8080
      targetPort: 8080
