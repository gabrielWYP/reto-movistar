apiVersion: v1
kind: ConfigMap
metadata:
  name: collections-agent-config
data:
  SONIA_HOST: "0.0.0.0"
  SONIA_PORT: "8080"
  SONIA_LOG_LEVEL: "INFO"
  SONIA_COLLECTIONS_MODEL: "deepseek-v4-flash"
  SONIA_COLLECTIONS_MAX_TOOL_CALLS: "3"
  SONIA_COLLECTIONS_MAX_OUTPUT_TOKENS: "700"
  SONIA_COLLECTIONS_MAX_UPLOAD_BYTES: "26214400"
  SONIA_COLLECTIONS_MAX_UPLOAD_FILES: "6"
