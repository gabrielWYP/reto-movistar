services:
  back:
    build:
      context: .
      dockerfile: back/Dockerfile
    environment:
      SONIA_DATASET: /data
      SONIA_HOST: 0.0.0.0
      SONIA_PORT: "8080"
      SONIA_UPLOAD_ROOT: /tmp/sonia-billing
      SONIA_MAX_UPLOAD_MB: "20"
      SONIA_MAX_UNCOMPRESSED_MB: "48"
      SONIA_BILLING_MODEL: ${SONIA_BILLING_MODEL:-gpt-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - "${SONIA_DATASET:-./data/source/DATASET}:/data:ro"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    depends_on:
      back:
        condition: service_healthy
    environment:
      BACKEND_HOST: back
      BACKEND_PORT: "8080"
    ports:
      - "127.0.0.1:${SONIA_PUBLIC_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=4m
      - /tmp:rw,noexec,nosuid,size=32m
    restart: unless-stopped
