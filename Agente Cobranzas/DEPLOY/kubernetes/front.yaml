apiVersion: apps/v1
kind: Deployment
metadata:
  name: collections-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collections-front
  template:
    metadata:
      labels:
        app: collections-front
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: ghcr.io/gabrielwyp/sonia-collections-front:replace-with-tag
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_HOST
              value: collections-back
            - name: BACKEND_PORT
              value: "8080"
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: collections-front
spec:
  type: ClusterIP
  selector:
    app: collections-front
  ports:
    - port: 8080
      targetPort: 8080
