services:
  bi-back:
    build:
      context: .
      dockerfile: BACK/Dockerfile
    environment:
      SONIA_HOST: 0.0.0.0
      SONIA_PORT: "8080"
      SONIA_LOG_LEVEL: INFO
      SONIA_BI_MODEL: ${SONIA_BI_MODEL:-deepseek-v4-flash}
      OPENCODE_KEY: ${OPENCODE_KEY:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped

  bi-front:
    build:
      context: .
      dockerfile: FRONT/Dockerfile
    environment:
      BACKEND_HOST: bi-back
      BACKEND_PORT: "8080"
    depends_on:
      bi-back:
        condition: service_healthy
    ports:
      - "${SONIA_BI_PUBLIC_PORT:-8082}:8080"
    restart: unless-stopped
