name: CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-k3s.yml"
      - Dockerfile
      - "frontend/**"
      - pyproject.toml
      - "src/**"
      - "tests/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-k3s.yml"
      - Dockerfile
      - "frontend/**"
      - pyproject.toml
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Verify formatting
        run: python -m ruff format --check src tests

      - name: Type check
        run: python -m mypy src

      - name: Test
        run: python -m pytest

  container:
    name: Container smoke test
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Build application image
        run: docker build --tag sonia-movistar:ci .

      - name: Verify hardened runtime and health
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --publish 127.0.0.1:18080:8080 \
            sonia-movistar:ci)"
          trap 'docker stop "${container_id}" >/dev/null 2>&1 || true' EXIT

          response="$(curl --fail --silent --show-error \
            --retry 10 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:18080/health)"
          python -c \
            'import json,sys; payload=json.loads(sys.argv[1]); assert payload["status"] == "ok"' \
            "${response}"

          curl --fail --silent --show-error \
            http://127.0.0.1:18080/ \
            | grep --fixed-strings --quiet "Centro de operaciones"

          scenario="$(curl --fail --silent --show-error \
            http://127.0.0.1:18080/api/demo/scenario)"
          python -c \
            'import json,sys; payload=json.loads(sys.argv[1]); assert len(payload["agents"]) == 3' \
            "${scenario}"

          test "$(docker inspect "${container_id}" --format '{{.Config.User}}')" = "1001:1001"
          test "$(docker inspect "${container_id}" --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
