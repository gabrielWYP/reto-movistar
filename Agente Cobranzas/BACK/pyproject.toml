[build-system] requires = ["setuptools>=75"] build-backend = "setuptools.build_meta"  [project] name = "sonia-collections-agent" version = "0.1.0" description = "Deterministic collections and payment-reconciliation agent for SON-IA." requires-python = ">=3.11" dependencies = [   "fastapi>=0.115,<1.0",   "openai>=1.0,<2.0",   "python-multipart>=0.0.20,<1.0",   "uvicorn[standard]>=0.34,<1.0", ]  [project.scripts] sonia-collections = "collections_agent.cli:main" sonia-collections-api = "collections_agent.__main__:main"  [tool.setuptools.packages.find] where = ["src"]  [tool.pytest.ini_options] pythonpath = ["src"] testpaths = ["tests"]