[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sonia-movistar"
version = "0.1.0"
description = "SON-IA agentic operations prototype for the Movistar challenge"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "SON-IA Team" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "openai>=1.0,<2.0",
  "pydantic>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
sonia = "sonia.__main__:main"
sonia-billing = "sonia.agents.billing.cli:main"
sonia-collections = "sonia.agents.collections.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.15,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/sonia/agents", "tests/agents"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "../Agente BI/BACK/src"]
packages = ["sonia"]

[[tool.mypy.overrides]]
module = [
  "sonia.agents.billing.*",
  "sonia.agents.collections.*",
]
ignore_errors = true
