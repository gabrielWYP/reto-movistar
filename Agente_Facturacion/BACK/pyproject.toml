[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sonia-billing-backend"
version = "1.0.0"
description = "Evidence-first Billing Assurance backend for SON-IA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "uvicorn>=0.34,<1.0",
]

[project.scripts]
sonia-billing = "billing_agent.cli:main"
sonia-billing-back = "billing_agent.__main__:main"

[project.optional-dependencies]
dev = ["httpx>=0.28,<1.0", "pytest>=8.3,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
