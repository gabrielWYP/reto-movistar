services:
  collections-back:
    build:
      context: .
      dockerfile: BACK/Dockerfile
    environment:
      SONIA_HOST: 0.0.0.0
      SONIA_PORT: "8080"
      SONIA_LOG_LEVEL: INFO
      SONIA_COLLECTIONS_MODEL: ${SONIA_COLLECTIONS_MODEL:-}
      SONIA_COLLECTIONS_REASONING_EFFORT: ${SONIA_COLLECTIONS_REASONING_EFFORT:-}
      SONIA_COLLECTIONS_MAX_TOOL_CALLS: ${SONIA_COLLECTIONS_MAX_TOOL_CALLS:-}
      SONIA_COLLECTIONS_MAX_OUTPUT_TOKENS: ${SONIA_COLLECTIONS_MAX_OUTPUT_TOKENS:-}
      SONIA_COLLECTIONS_MAX_UPLOAD_BYTES: ${SONIA_COLLECTIONS_MAX_UPLOAD_BYTES:-}
      SONIA_COLLECTIONS_MAX_UPLOAD_FILES: ${SONIA_COLLECTIONS_MAX_UPLOAD_FILES:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped

  collections-front:
    build:
      context: .
      dockerfile: FRONT/Dockerfile
    environment:
      BACKEND_HOST: collections-back
      BACKEND_PORT: "8080"
    depends_on:
      collections-back:
        condition: service_healthy
    ports:
      - "${SONIA_COLLECTIONS_PUBLIC_PORT:-8081}:8080"
    restart: unless-stopped
