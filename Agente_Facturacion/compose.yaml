services:
  billing-back:
    build:
      context: .
      dockerfile: BACK/Dockerfile
    environment:
      SONIA_DATASET: /data
      SONIA_HOST: 0.0.0.0
      SONIA_PORT: "8080"
      SONIA_UPLOAD_ROOT: /tmp/sonia-billing
      SONIA_MAX_UPLOAD_MB: "20"
      SONIA_MAX_UNCOMPRESSED_MB: "48"
      SONIA_BILLING_MODEL: ${SONIA_BILLING_MODEL:-deepseek-v4-flash}
      OPENCODE_KEY: ${OPENCODE_KEY:-}
    volumes:
      - "${SONIA_DATASET:-../data/source/DATASET}:/data:ro"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped

  billing-front:
    build:
      context: .
      dockerfile: FRONT/Dockerfile
    depends_on:
      billing-back:
        condition: service_healthy
    environment:
      BACKEND_HOST: billing-back
      BACKEND_PORT: "8080"
    ports:
      - "127.0.0.1:${SONIA_PUBLIC_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=4m
      - /tmp:rw,noexec,nosuid,size=32m
    restart: unless-stopped
